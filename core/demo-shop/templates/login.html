{% extends 'base.html' %}{% block content %}<section class="form-card"><span class="eyebrow">WELCOME BACK</span><h1>A fresh start to your day.</h1><p>Log in with your demo account. Use only a test password.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="email">Phone number or test email</label><input id="email" name="email" type="text" autocomplete="username" required><label for="password">Test password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button full">Log in</button></form><p class="form-footer">New here? <a href="{{ url_for('signup') }}">Create a demo account</a></p></section>{% endblock %}
